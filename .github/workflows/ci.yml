name: Flutter compatibility and release checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop, "feat/**"]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Proves that the declared Flutter/Dart floor resolves the minimum WebView
  # graph, passes the package suite, and builds a real Android consumer app.
  minimum-android:
    name: Flutter 3.3.8 - package floor and Android harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter 3.3.8
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.3.8"
          channel: stable
          cache: true
      - name: Verify the minimum dependency graph
        run: |
          rm -f pubspec.lock
          flutter pub downgrade
          flutter pub deps > /tmp/flutter-deps.txt
          grep -F "webview_flutter 4.1.0" /tmp/flutter-deps.txt
          grep -F "webview_flutter_android 3.0.0" /tmp/flutter-deps.txt
          grep -F "webview_flutter_platform_interface 2.1.0" /tmp/flutter-deps.txt
          grep -F "webview_flutter_wkwebview 3.0.0" /tmp/flutter-deps.txt
          flutter analyze lib --no-pub
      - name: Restore test-compatible graph
        run: |
          rm -f pubspec.lock
          flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze package
        run: flutter analyze lib test
      - name: Run package tests
        run: flutter test
      - name: Build Flutter 3.3.8 compatibility harness for Android
        working-directory: example/compatibility/flutter_3_3_8
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub

  # Proves the upper end of the supported range against the current Flutter
  # train and builds the full public gallery with its modern Android scaffold.
  latest-android:
    name: Flutter 3.44.9 - latest train and Android gallery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Resolve and verify the latest dependency graph
        run: |
          flutter pub upgrade
          flutter pub deps > /tmp/flutter-deps.txt
          grep -F "webview_flutter 4.14.1" /tmp/flutter-deps.txt
          grep -F "webview_flutter_android 4.13.0" /tmp/flutter-deps.txt
          grep -F "webview_flutter_platform_interface 2.15.1" /tmp/flutter-deps.txt
          grep -F "webview_flutter_wkwebview 3.26.0" /tmp/flutter-deps.txt
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze package
        run: flutter analyze lib test
      - name: Run package tests
        run: flutter test
      - name: Analyze, test, and build the Android gallery
        working-directory: example
        run: |
          rm -f pubspec.lock
          flutter pub upgrade
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub

  # Exercises the PRD target train independently so regressions between the
  # declared floor and latest Flutter are not hidden by endpoint-only testing.
  target-3-41-android:
    name: Flutter 3.41.9 - target train and Android harness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter 3.41.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Resolve and verify the Flutter 3.41 dependency graph
        run: |
          rm -f pubspec.lock
          flutter pub upgrade
          flutter pub deps > /tmp/flutter-deps.txt
          grep -F "webview_flutter 4.14.1" /tmp/flutter-deps.txt
          grep -F "webview_flutter_android 4.12.0" /tmp/flutter-deps.txt
          grep -F "webview_flutter_platform_interface 2.15.1" /tmp/flutter-deps.txt
          grep -F "webview_flutter_wkwebview 3.25.1" /tmp/flutter-deps.txt
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze package
        run: flutter analyze lib test
      - name: Run package tests
        run: flutter test
      - name: Build Flutter 3.41.9 compatibility harness for Android
        working-directory: example/compatibility/flutter_3_41_9
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub

  # Confirms the oldest stock Flutter train known to build this harness for an
  # iOS simulator on the hosted runner's current Xcode. This is not the package
  # source floor and does not replace the planned Flutter 3.3.8/Xcode 14.1 test.
  ios-boundary:
    name: Flutter 3.7.12 - current-Xcode iOS boundary
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flutter 3.7.12
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.7.12"
          channel: stable
          cache: true
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Resolve wrapper dependencies
        run: flutter pub get
      - name: Build floor harness for iOS simulator
        working-directory: example/compatibility/flutter_3_3_8
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter build ios --simulator --no-codesign --no-pub

  # Builds a real iOS consumer at the PRD target train using the harness native
  # scaffold generated by that Flutter version.
  target-3-41-ios:
    name: Flutter 3.41.9 - target train and iOS harness
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flutter 3.41.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Resolve wrapper dependencies
        run: flutter pub upgrade
      - name: Build Flutter 3.41.9 compatibility harness for iOS simulator
        working-directory: example/compatibility/flutter_3_41_9
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter build ios --simulator --no-codesign --no-pub

  # Proves the public gallery builds on iOS with the current Flutter train and
  # the hosted runner's current Xcode toolchain.
  latest-ios:
    name: Flutter 3.44.9 - latest train and iOS gallery
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Resolve wrapper dependencies
        run: flutter pub upgrade
      - name: Build gallery for iOS simulator
        working-directory: example
        run: |
          rm -f pubspec.lock
          flutter pub upgrade
          flutter build ios --simulator --no-codesign --no-pub

  # Keeps package publication validation independent of a platform build and
  # runs only after every compatibility lane above succeeds.
  release-audit:
    name: Release audit - pub.dev package dry-run
    needs:
      - minimum-android
      - target-3-41-android
      - latest-android
      - ios-boundary
      - target-3-41-ios
      - latest-ios
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Validate pub.dev package archive
        run: flutter pub publish --dry-run
