name: Flutter compatibility and release checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Proves that the declared Flutter/Dart floor resolves and analyzes production
  # source. Tests and the Android harness use the compatible graph from pub get.
  android-minimum:
    name: Android · Flutter 3.3.8 · minimum supported
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter 3.3.8
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.3.8"
          channel: stable
          cache: true
      - name: Verify the minimum dependency graph
        run: |
          rm -f pubspec.lock
          flutter pub downgrade
          flutter pub deps | tee /tmp/flutter-deps.txt
          grep -F "webview_flutter 4.1.0" /tmp/flutter-deps.txt
          grep -F "webview_flutter_android 3.0.0" /tmp/flutter-deps.txt
          grep -F "webview_flutter_platform_interface 2.1.0" /tmp/flutter-deps.txt
          grep -F "webview_flutter_wkwebview 3.0.0" /tmp/flutter-deps.txt
          flutter analyze lib --no-pub
      - name: Restore test-compatible graph
        run: |
          rm -f pubspec.lock
          flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze package
        run: flutter analyze lib test
      - name: Run package tests
        run: flutter test
      - name: Build Flutter 3.3.8 compatibility harness for Android
        working-directory: example/compatibility/flutter_3_3_8
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub

  # Proves the upper end of the supported range against the current Flutter
  # train and builds the full public gallery with its modern Android scaffold.
  android-latest:
    name: Android · Flutter 3.44.9 · latest stable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Resolve and verify the latest dependency graph
        run: |
          flutter pub upgrade
          flutter pub deps | tee /tmp/flutter-deps.txt
          # `pub upgrade` selects the highest resolvable versions, so this graph
          # changes whenever webview_flutter or any of its platform packages is
          # published - independently of anything in this repository. Assert the
          # invariant instead: resolution stays inside the declared
          # ">=4.1.0 <5.0.0" range and every platform package keeps its expected
          # major. The exact graph is recorded below so drift stays reviewable.
          grep -Eq "webview_flutter 4\.[0-9]+\.[0-9]+" /tmp/flutter-deps.txt
          grep -Eq "webview_flutter_android 4\.[0-9]+\.[0-9]+" /tmp/flutter-deps.txt
          grep -Eq "webview_flutter_platform_interface 2\.[0-9]+\.[0-9]+" /tmp/flutter-deps.txt
          grep -Eq "webview_flutter_wkwebview 3\.[0-9]+\.[0-9]+" /tmp/flutter-deps.txt
          echo "::group::Resolved WebView graph"
          grep -oE "webview_flutter[a-z_]* [0-9][^ ]*" /tmp/flutter-deps.txt | sort -u
          echo "::endgroup::"
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze package
        run: flutter analyze lib test
      - name: Run package tests
        run: flutter test
      - name: Analyze, test, and build the Android gallery
        working-directory: example
        run: |
          rm -f pubspec.lock
          flutter pub upgrade
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub

  # Exercises the PRD target train independently so regressions between the
  # declared floor and latest Flutter are not hidden by endpoint-only testing.
  android-midrange:
    name: Android · Flutter 3.41.9 · mid-range stable
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter 3.41.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Resolve and verify the Flutter 3.41 dependency graph
        run: |
          rm -f pubspec.lock
          flutter pub upgrade
          flutter pub deps | tee /tmp/flutter-deps.txt
          # `pub upgrade` selects the highest resolvable versions, so this graph
          # changes whenever webview_flutter or any of its platform packages is
          # published - independently of anything in this repository. Assert the
          # invariant instead: resolution stays inside the declared
          # ">=4.1.0 <5.0.0" range and every platform package keeps its expected
          # major. The exact graph is recorded below so drift stays reviewable.
          grep -Eq "webview_flutter 4\.[0-9]+\.[0-9]+" /tmp/flutter-deps.txt
          grep -Eq "webview_flutter_android 4\.[0-9]+\.[0-9]+" /tmp/flutter-deps.txt
          grep -Eq "webview_flutter_platform_interface 2\.[0-9]+\.[0-9]+" /tmp/flutter-deps.txt
          grep -Eq "webview_flutter_wkwebview 3\.[0-9]+\.[0-9]+" /tmp/flutter-deps.txt
          echo "::group::Resolved WebView graph"
          grep -oE "webview_flutter[a-z_]* [0-9][^ ]*" /tmp/flutter-deps.txt | sort -u
          echo "::endgroup::"
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze package
        run: flutter analyze lib test
      - name: Run package tests
        run: flutter test
      - name: Build Flutter 3.41.9 compatibility harness for Android
        working-directory: example/compatibility/flutter_3_41_9
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
          flutter build apk --debug --no-pub

  # Confirms Flutter 3.7.12 can build the deliberately legacy 3.3-era consumer
  # scaffold. This is not a Flutter 3.3.8 SDK or Xcode 14.1 certification run.
  ios-minimum:
    name: iOS · Flutter 3.7.12 · minimum supported
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flutter 3.7.12
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.7.12"
          channel: stable
          cache: true
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Build 3.3-era harness with Flutter 3.7.12 for iOS simulator
        working-directory: example/compatibility/flutter_3_3_8
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter build ios --simulator --no-codesign --no-pub

  # Builds a real iOS consumer at the PRD target train using the harness native
  # scaffold generated by that Flutter version.
  ios-midrange:
    name: iOS · Flutter 3.41.9 · mid-range stable
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flutter 3.41.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Build Flutter 3.41.9 compatibility harness for iOS simulator
        working-directory: example/compatibility/flutter_3_41_9
        run: |
          rm -f pubspec.lock
          flutter pub get
          flutter build ios --simulator --no-codesign --no-pub

  # Proves the public gallery builds on iOS with the current Flutter train and
  # the hosted runner's current Xcode toolchain.
  ios-latest:
    name: iOS · Flutter 3.44.9 · latest stable
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Record Xcode version
        run: xcodebuild -version
      - name: Build gallery for iOS simulator
        working-directory: example
        run: |
          rm -f pubspec.lock
          flutter pub upgrade
          flutter build ios --simulator --no-codesign --no-pub

  # Keeps package publication validation independent of a platform build and
  # runs only after every compatibility lane above succeeds.
  package-audit:
    name: Package · publish dry-run and archive audit
    needs:
      - android-minimum
      - android-midrange
      - android-latest
      - ios-minimum
      - ios-midrange
      - ios-latest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Flutter 3.44.9
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.9"
          channel: stable
          cache: true
      - name: Generate pub.dev package dry-run
        run: |
          set -o pipefail
          flutter pub publish --dry-run 2>&1 | tee /tmp/pub-dry-run.txt

      # `pub publish --dry-run` prints a file tree and appends a size to every
      # entry: "<box-drawing prefix> LICENSE (1 KB)". Anchoring on "$" never
      # matches, and the prefix is Unicode box-drawing rather than ASCII, so it
      # cannot be matched literally either. Anchor on the space before the name
      # and the space before the size instead: that pins the exact filename and
      # will not match a substring such as "license.env.example".
      - name: Validate required package files
        run: |
          grep -Eq -- ' LICENSE \(' /tmp/pub-dry-run.txt
          grep -Eq -- ' THIRD_PARTY_NOTICES\.md \(' /tmp/pub-dry-run.txt
          grep -Eq -- ' fusioncharts-4\.2\.2-manifest\.json \(' /tmp/pub-dry-run.txt
          grep -Eq -- ' fusioncharts\.usa\.js \(' /tmp/pub-dry-run.txt

      - name: Validate package warnings and exclusions
        run: |
          grep -F "Package has 0 warnings." /tmp/pub-dry-run.txt
          if grep -Eq -- ' \.env \(' /tmp/pub-dry-run.txt; then
            echo "The package archive must not contain an .env file."
            exit 1
          fi
